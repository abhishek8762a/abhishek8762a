<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ds" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2E8F0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E2E8F0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="1200" height="2" rx="1" fill="url(#dl)"/>
  <rect x="0" y="4" width="220" height="2" rx="1" fill="url(#ds)" opacity="0.7">
    <animate attributeName="x" values="-220;1200" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
