<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Abhishek Kumar — Data Analyst · SQL · Power BI · Python">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0C1628"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0F7FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)" opacity="0.55"/>

  <ellipse cx="230" cy="100" rx="420" ry="260" fill="url(#glowC)">
    <animate attributeName="cx" values="230;330;230" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="990" cy="240" rx="440" ry="280" fill="url(#glowB)">
    <animate attributeName="cx" values="990;880;990" dur="14s" repeatCount="indefinite"/>
  </ellipse>

  <!-- left: animated bar chart motif -->
  <g transform="translate(70,250)">
    <rect x="0"   y="-60"  width="16" height="60"  rx="3" fill="url(#bar)"><animate attributeName="height" values="60;90;60" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="-60;-90;-60" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="26"  y="-100" width="16" height="100" rx="3" fill="url(#barB)"><animate attributeName="height" values="100;70;100" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="-100;-70;-100" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="52"  y="-75"  width="16" height="75"  rx="3" fill="url(#bar)"><animate attributeName="height" values="75;120;75" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="-75;-120;-75" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="78"  y="-130" width="16" height="130" rx="3" fill="url(#barB)"><animate attributeName="height" values="130;95;130" dur="4.5s" repeatCount="indefinite"/><animate attributeName="y" values="-130;-95;-130" dur="4.5s" repeatCount="indefinite"/></rect>
    <rect x="104" y="-90"  width="16" height="90"  rx="3" fill="url(#bar)"><animate attributeName="height" values="90;140;90" dur="5.5s" repeatCount="indefinite"/><animate attributeName="y" values="-90;-140;-90" dur="5.5s" repeatCount="indefinite"/></rect>
    <line x1="-8" y1="0" x2="132" y2="0" stroke="#1E293B" stroke-width="2"/>
  </g>

  <!-- right: sparkline motif -->
  <g transform="translate(1000,112) scale(0.8)" fill="none">
    <polyline points="0,110 30,92 60,100 90,64 120,74 150,38 180,50" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;0;0;320" keyTimes="0;0.4;0.85;1" dur="7s" repeatCount="indefinite"/>
    </polyline>
    <circle cx="180" cy="50" r="4.5" fill="#22D3EE"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.85;1" dur="7s" repeatCount="indefinite"/></circle>
    <line x1="0" y1="130" x2="190" y2="130" stroke="#1E293B" stroke-width="2"/>
    <text x="0" y="150" fill="#475569" font-family="'Consolas','SF Mono',Menlo,monospace" font-size="12" letter-spacing="1">SELECT insight FROM data;</text>
  </g>

  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <text x="600" y="80" text-anchor="middle" fill="#64748B" font-family="'Consolas','SF Mono',Menlo,monospace" font-size="15" letter-spacing="7">D A T A &#160;·&#160; S Y S T E M S &#160;·&#160; A U T O M A T I O N</text>

  <text x="600" y="160" text-anchor="middle" fill="#E2E8F0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="8">ABHISHEK KUMAR</text>

  <rect x="410" y="184" width="380" height="3" rx="1.5" fill="url(#accent)"/>
  <rect x="410" y="184" width="120" height="3" rx="1.5" fill="url(#sheen)">
    <animate attributeName="x" values="410;670;410" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>

  <text x="600" y="228" text-anchor="middle" fill="#22D3EE" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" letter-spacing="1.2">Data Analyst &#160;·&#160; Manufacturing &amp; Pharma Data &#160;·&#160; AI + SQL</text>

  <g font-family="'Consolas','SF Mono',Menlo,monospace" font-size="13" letter-spacing="1">
    <g transform="translate(318,256)"><rect width="100" height="28" rx="14" fill="#0F172A" stroke="#1E293B"/><circle cx="16" cy="14" r="3.5" fill="#22D3EE"/><text x="30" y="19" fill="#94A3B8">SQL</text></g>
    <g transform="translate(428,256)"><rect width="126" height="28" rx="14" fill="#0F172A" stroke="#1E293B"/><circle cx="16" cy="14" r="3.5" fill="#F2C811"/><text x="30" y="19" fill="#94A3B8">Power BI</text></g>
    <g transform="translate(564,256)"><rect width="110" height="28" rx="14" fill="#0F172A" stroke="#1E293B"/><circle cx="16" cy="14" r="3.5" fill="#3B82F6"/><text x="30" y="19" fill="#94A3B8">Python</text></g>
    <g transform="translate(684,256)"><rect width="198" height="28" rx="14" fill="#0F172A" stroke="#1E293B"/><circle cx="16" cy="14" r="3.5" fill="#06B6D4"/><text x="30" y="19" fill="#94A3B8">Apps Script · MIS</text></g>
  </g>

  <g transform="translate(1040,24)">
    <rect width="140" height="26" rx="13" fill="#052E2B" stroke="#10B981" stroke-opacity="0.6"/>
    <circle cx="16" cy="13" r="4" fill="#10B981"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="28" y="17.5" fill="#6EE7B7" font-family="'Consolas','SF Mono',Menlo,monospace" font-size="11.5" letter-spacing="1">OPEN TO WORK</text>
  </g>

  <rect x="0" y="317" width="1200" height="3" fill="url(#accent)" opacity="0.7"/>
</svg>
